# Vhost minimal pour les tests E2E Playwright (Phase K) — pas de Traefik,
# pas de TLS, pas de cache : on veut juste php-fpm en multi-workers reel.
server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm-e2e:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Le 1er appel a froid (bind-mount Windows + cache Symfony vide) peut
        # depasser le defaut nginx de 60s — cout unique par cycle de conteneur,
        # pas par test Playwright (cache ensuite chaud tout au long de la suite).
        fastcgi_read_timeout 180s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
