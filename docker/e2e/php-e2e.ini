; Tuning spécifique au conteneur e2e (bind-mount Windows lent) — ne touche pas
; a docker/php-custom.dockerfile (partage avec la prod, qui ne bind-mount pas
; depuis Windows et n'a donc pas ce problème).
;
; opcache.validate_timestamps=1 (défaut) fait un stat() par fichier PHP chargé
; à CHAQUE requête pour detecter un changement source — avec un bind-mount
; Windows (virtiofs), potentiellement des milliers de stat() (vendor/src/DI
; container généré) traversent le pont hôte<->VM à chaque requête : mesure en
; pratique ~38s/requête avec cache Symfony pourtant déjà chaud. Sans cette
; validation, le code source doit être recompilé (docker compose restart
; php-fpm-e2e) pour qu'un changement soit pris en compte — acceptable pour un
; conteneur e2e jetable, pas pour la prod.
opcache.validate_timestamps=0
realpath_cache_ttl=600
