# Definition des services pour la stack Symfony
services:
  # ma base de données postgreSQL
  database-ma-moulinette:
    platform: ${platform}
    container_name: postgresql-ma-moulinette
    image: "postgres:${postgresql_version}"
    hostname: postgresql-ma-moulinette
    restart: "unless-stopped"
    shm_size: "128mb"
    ports:
      - "5433:5432"
    security_opt:
      - no-new-privileges:true
    environment:
      - "TZ=${LOCAL_TZ}"
      - "LANG=${LOCAL_LANG}"
      - "POSTGRES_PASSWORD=${postgresql_password}"
      - "SQL_DIR=/data/sql/update"
      - "INIT_SQL_DIR=/docker-entrypoint-initdb.d"
    volumes:
      - "${root_volume}/data/sql:/docker-entrypoint-initdb.d"
      - "${root_volume}/postgresql:/var/lib/postgresql/18/docker"
      - "${root_volume}/data/update-sql:/data/sql/update"
      - "${root_volume}/scripts/postgresql/execute_sql_files.sh:/scripts/postgresql/execute_sql_files.sh"
      - "${root_volume}/scripts/postgresql/init_sql_files.sh:/docker-entrypoint-initdb.d/init_sql_files.sh"
    networks:
      - proxy-net

  php-fpm-ma-moulinette:
    platform: ${platform}
    container_name: php-fpm-ma-moulinette
    hostname: php-fpm-ma-moulinette
    environment:
      - "TZ=${LOCAL_TZ}"
      - "LANG=${LOCAL_LANG}"
    build:
      dockerfile: php-custom.dockerfile
      context: .
      args:
      - "http_proxy=${http_proxy}"
      - "https_proxy=${https_proxy}"
    volumes:
      - "${root_volume}/web-app:/var/www/"
    restart: unless-stopped
    depends_on:
      - database-ma-moulinette
    networks:
      - proxy-net

  nginx-ma-moulinette:
    platform: ${platform}
    image: nginx:${nginx_version}
    container_name: nginx-ma-moulinette
    environment:
      - "TZ=${LOCAL_TZ}"
      - "LANG=${LOCAL_LANG}"
      - "http_proxy=${http_proxy}"
      - "https_proxy=${https_proxy}"
      - "no_proxy=${no_proxy}"
    volumes:
      - "${root_volume}/web-app:/var/www/"
      - "${root_volume}/log:/var/log/nginx/"
      - "${root_volume}/opt:/opt:rw"      
      - "${root_volume}/etc/nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro"
      - "${root_volume}/etc/nginx/conf.d/:/etc/nginx/conf.d/:ro"
      - "${root_volume}/etc/nginx/sites-enabled/:/etc/nginx/sites-enabled/:ro"
      - "${root_volume}/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${root_volume}/etc/nginx/mime.types:/etc/nginx/mime.types:ro"
    restart: unless-stopped
    depends_on:
      - php-fpm-ma-moulinette
      - database-ma-moulinette
    links:
      - php-fpm-ma-moulinette
    networks:
      - proxy-net
    labels:
      - "traefik.enable=${traefik_enable}"
      - "traefik.http.routers.${traefik_container}.rule=Host(`${traefik_host}`)"
      - "traefik.http.routers.${traefik_container}.rule=PathPrefix(`${traefik_pathprefix}`)"
      - "traefik.http.routers.${traefik_container}.entrypoints=web"
      - "traefik.http.services.${traefik_container}.loadbalancer.server.port=${traefik_lb_port}"
      - "traefik.http.routers.${traefik_container}.middlewares=${traefik_container}-middle-headers"
      - "traefik.http.middlewares.${traefik_container}-middle-headers.headers.customrequestheaders.X-Forwarded-Prefix=${traefik_forwarded_prefix}"
      - "traefik.http.middlewares.${traefik_container}-middle-headers.headers.customrequestheaders.X-Debug-Traefik=traefik-header"
      - "traefik.http.routers.${traefik_container}.middlewares=${traefik_container}-middle"
      - "traefik.http.middlewares.${traefik_container}-middle.stripprefix.prefixes=${traefik_pathprefix}"

      - "traefik.http.routers.${traefik_container}-https.rule=Host(`${traefik_host}`)"
      - "traefik.http.routers.${traefik_container}-https.rule=PathPrefix(`${traefik_pathprefix}`)"
      - "traefik.http.routers.${traefik_container}-https.entrypoints=websecure"
      - "traefik.http.routers.${traefik_container}-https.middlewares=${traefik_container}-https-middle-headers"
      - "traefik.http.middlewares.${traefik_container}-https-middle-headers.headers.customrequestheaders.X-Forwarded-Prefix==${traefik_forwarded_prefix}"
      - "traefik.http.middlewares.${traefik_container}-https-middle-headers.headers.customrequestheaders.X-Debug-Traefik=traefik-header"
      - "traefik.http.routers.${traefik_container}-https.middlewares=${traefik_container}-https-middle"
      - "traefik.http.middlewares.${traefik_container}-https-middle.stripprefix.prefixes=${traefik_pathprefix}"

      - "traefik.http.routers.${traefik_container}-https.tls=true"
      - "traefik.http.middlewares.${traefik_container}-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${traefik_container}-redirect-to-https.redirectscheme.permanent=true"

# Définition des réseaux
networks:
  proxy-net:
    name: proxy-net
    external: true
