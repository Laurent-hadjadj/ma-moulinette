---
# config/services_test.yaml
#
# MODIF 2026-05-07 : creation pour wirer le double de test
# `SonarFixtureClientService` sur l'alias `App\Service\ClientService` dans l'env test.
# Sans ce wiring, `static::getContainer()->get(ClientService::class)` retourne le vrai
# ClientService et toutes les requêtes SonarQube échouent en 503 (serveur absent).
#
# Pre-requis : autoload-dev `App\Tests\\` => tests/ (composer.json), ce qui rend
# la classe `App\Tests\Support\SonarFixtureClientService` visible cote container.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Enregistrement explicite du double (les classes de tests/ ne sont pas
    # incluses dans le glob `App\:` de services.yaml).
    App\Tests\Support\SonarFixtureClientService:
        public: true

    # Substitution : tout consommateur qui demande ClientService reçoit le double.
    # Le test `testContainerResolvesClientServiceToTestDouble` valide ce wiring.
    App\Service\ClientService:
        alias: App\Tests\Support\SonarFixtureClientService
        public: true
...
