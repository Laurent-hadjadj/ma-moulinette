---
framework:
    messenger:
        failure_transport: failed
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'
            activity_queue:
                dsn: 'doctrine://default?queue_name=activity_queue'
                options: {}
        routing:
            'App\Message\ProcessTaskMessage': activity_queue

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
...
