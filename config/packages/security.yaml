---
security:
    # On ne lève pas une exception si l'utilisateur n'existe pas
    hide_user_not_found: false

    role_hierarchy:
        ROLE_COLLECTE: ['ROLE_UTILISATEUR']
        ROLE_BATCH: ['ROLE_COLLECTE', 'ROLE_UTILISATEUR']
        ROLE_ACTUATOR: ['ROLE_COLLECTE', 'ROLE_UTILISATEUR']
        ROLE_GESTIONNAIRE: ['ROLE_COLLECTE', 'ROLE_BATCH', 'ROLE_ACTUATOR','ROLE_UTILISATEUR']
        ROLE_INTERNAL:  ['ROLE_COLLECTE', 'ROLE_BATCH', 'ROLE_ACTUATOR','ROLE_UTILISATEUR', 'ROLE_INTERNAL']

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'bcrypt'
            cost:      13
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: courriel

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall pour les API : renvoie JSON via ApiSecurityHandler
        api:
            pattern: ^/api
            # On partage le contexte de sécurité 'main' pour réutiliser la session/login
            context: main
            lazy: true
            provider: app_utilisateur_provider
            entry_point: App\Security\ApiSecurityHandler
            access_denied_handler: App\Security\ApiSecurityHandler

        # Firewall principal (web)
        main:
            pattern: ^/
            lazy: true
            provider: app_utilisateur_provider

            # Authentification formulaire + notre custom authenticator
            form_login:
                login_path: login
                check_path: login

            custom_authenticators:
                - App\Security\CustomAuthenticator

            # L'entry point pour la partie "web" = notre CustomAuthenticator
            entry_point: App\Security\CustomAuthenticator

            logout:
                path: logout
                target: login
                invalidate_session: true
                delete_cookies:
                    REMEMBERME: ~

            # Maximum login par minutes
            # composer require symfony/rate-limiter
            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

            remember_me: false
                #secret: '%kernel.secret%'
                # si le mot de passe change, le cookie est invalide
                #signature_properties: [password]

    access_control:
        # API
        - { path: ^/api/public/, roles: PUBLIC_ACCESS }
        - { path: ^/api/secure/, roles: ROLE_UTILISATEUR }

        # Web (public)
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/welcome, roles: PUBLIC_ACCESS }
        - { path: ^/plan-du-site, roles: PUBLIC_ACCESS }
        - { path: ^/mention-legal, roles: PUBLIC_ACCESS }
        - { path: ^/donnees-personnelles, roles: PUBLIC_ACCESS }

        # Web (privé)
        - { path: ^/admin, roles: ROLE_GESTIONNAIRE }
        - { path: ^/, roles: ROLE_UTILISATEUR }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following

            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
...
