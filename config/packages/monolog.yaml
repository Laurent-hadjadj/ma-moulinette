---
monolog:
    channels:
        - deprecation
        - doctrine
        - messenger
        - profiling

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ['messenger']
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            deprecation:
                type: stream
                path: "%kernel.logs_dir%/deprecations.log"
                level: info
                channels: ["deprecation"]
            application_logs:
                type: stream
                path: "%kernel.logs_dir%/app-dev.log"
                level: debug
                channels: ["!security", "!event", "!doctrine", "!request", "!messenger", "!deprecation", "!profiling"]
                formatter: monolog.formatter.line
            # Handler dédié au profiling
            profiling:
                type: stream
                path: '%kernel.logs_dir%/profiling.log'
                level: info
                channels: ['profiling']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ['doctrine']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            application_logs:
                type: stream
                path: "%kernel.logs_dir%/app.log"
                level: info
                channels: ["!security", "!event", "!doctrine", "!request", "!messenger", "!deprecation", "!profiling"]
                formatter: monolog.formatter.line
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ['messenger']
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            profiling:
                type: stream
                path: '%kernel.logs_dir%/profiling.log'
                level: info
                channels: ['profiling']
