---
monolog:
    channels:
        - deprecation
        - doctrine
        - messenger
        - profiling

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ['messenger']
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            deprecation:
                type: stream
                path: "%kernel.logs_dir%/deprecations.log"
                level: info
                channels: ["deprecation"]
            application_logs:
                type: stream
                path: "%kernel.logs_dir%/app-dev.log"
                level: debug
                channels: ["!security", "!event", "!doctrine", "!request", "!messenger", "!deprecation", "!profiling"]
                formatter: monolog.formatter.line
            # Handler dédié au profiling
            profiling:
                type: stream
                path: '%kernel.logs_dir%/profiling.log'
                level: info
                channels: ['profiling']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ['doctrine']
            # MODIF 2026-10-11 : handler deprecation manquant en test (present en dev, mais
            # sous "deprecations.log" sans suffixe — ici "deprecations-test.log" suit la
            # convention attendue par la page Admin Logs/LogArchiveService pour l'env test).
            deprecation:
                type: stream
                path: "%kernel.logs_dir%/deprecations-test.log"
                level: info
                channels: ["deprecation"]
            # MODIF 2026-10-11 : handler manquant par rapport a dev/prod — LogArchiveService
            # classe les fichiers "app-*" comme logs applicatifs (page Admin Logs), et le
            # test e2e spec 19 attend "app-test.log" au meme titre que "app-dev.log"/"app.log".
            application_logs:
                type: stream
                path: "%kernel.logs_dir%/app-test.log"
                level: debug
                channels: ["!security", "!event", "!doctrine", "!request", "!messenger", "!deprecation", "!profiling"]
                formatter: monolog.formatter.line

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            application_logs:
                type: stream
                path: "%kernel.logs_dir%/app.log"
                level: info
                channels: ["!security", "!event", "!doctrine", "!request", "!messenger", "!deprecation", "!profiling"]
                formatter: monolog.formatter.line
            request:
                type: stream
                path: "%kernel.logs_dir%/request.log"
                level: error
                channels: ["request"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ['messenger']
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            profiling:
                type: stream
                path: '%kernel.logs_dir%/profiling.log'
                level: info
                channels: ['profiling']
