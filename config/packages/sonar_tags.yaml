---
# Configuration de app:sonar:update-tags (UpdateSonarqubeTagsCommand).
# Modifiable sans recompilation, juste un `bin/console cache:clear` après édition.
parameters:

    # MODIF 2026-11-22 : périmètre de groupes traités (clean + retag). SEULS
    # les projets dont l'un des groupes porte EXACTEMENT un de ces noms sont
    # nettoyés puis retagués (recherche directe par nom) ; tous les autres
    # sont ignorés sans aucune modification (y compris les projets archivés,
    # qui n'ont plus ce groupe d'appartenance une fois dans "Archive").
    # Périmètre vide = aucun groupe ne peut jamais matcher : chaque projet
    # reçoit alors le tag "aucun" avec un avertissement (plus de critère de
    # repli — la convention "2021" permissions+description a été retirée,
    # devenue inutile depuis que les groupes cibles sont toujours explicites).
    #
    # Lu depuis la variable d'environnement SONAR_TAGS_TARGET_GROUPS (liste
    # séparée par des virgules, ex. "LOT-1,LOT-2,LOT-3,LOT-4") plutôt qu'en
    # dur ici : les noms de groupes de l'organisation ne doivent pas être
    # committés dans ce fichier (dépôt GitHub public). Valeur réelle à
    # définir dans .env.local (jamais committé), jamais ici. Défaut "" (vide)
    # -> aucun groupe ; le garde-fou []
    # (UpdateSonarqubeTagsCommand::__construct) protège aussi le cas où la
    # variable existe mais est vide (le processeur "csv" de "" donne [""],
    # pas [] — normalisé explicitement, pas une simple coïncidence de valeur).
    env(SONAR_TAGS_TARGET_GROUPS): ''
    sonar_tags.target_groups: '%env(csv:SONAR_TAGS_TARGET_GROUPS)%'

    # MODIF 2026-11-22 : phase 3 — fichier optionnel de correspondance
    # maven_key (clé "project_key") → code applicatif métier (clé
    # "code_apli"), pour ajouter un tag métier en plus du tag de groupe,
    # uniquement sur les projets présents dans ce fichier. Cherché dans
    # l'ordre ci-dessous, le premier existant est utilisé ; aucun des deux
    # trouvé = étape ignorée (pas une erreur).
    # ATTENTION confidentialité (dépôt GitHub public) : var/ est ignoré par
    # git (sûr pour un fichier contenant de vraies clés Maven client) ;
    # migrations/ est versionné — ce fichier précis y est exclu par
    # précaution dans migrations/.gitignore, mais ne JAMAIS en committer un
    # autre portant de vraies données client sous ce dossier.
    sonar_tags.business_tag_file_candidates:
        - '%kernel.project_dir%/var/liste_code_appli.json'
        - '%kernel.project_dir%/migrations/liste_code_appli.json'
