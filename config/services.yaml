---
# services.yaml
# Ce fichier configure les services et dépendances spécifiques à l'application.

imports:
    - { resource: ma-moulinette.yaml }

# ---------------------------------------------------------------------------
# PARAMETERS
# Les paramètres globaux pour l'application sont définis ici.
# Ils sont généralement fournis par des variables d'environnement.
# ---------------------------------------------------------------------------

parameters:
    # API Secure
    app.client_token: '%env(APP_CLIENT_TOKEN)%'
    app.allowed_origins: '%env(csv:APP_ALLOWED_ORIGINS)%'
    api.client_token: '%env(API_CLIENT_TOKEN)%'

    # MODIF 2026-05-08 : token bearer pour /api/secure/dependency-check/*
    # Lu depuis .env / .env.local (DC_INGEST_TOKEN). Si "changeme" ou vide,
    # le subscriber renvoie 503 et l'endpoint est désactive (sécurité par défaut).
    dc.ingest.token: '%env(DC_INGEST_TOKEN)%'

    # Configuration SonarQube
    sonar.url: '%env(SONAR_URL)%'
    sonar.version: '%env(SONAR_VERSION)%'
    sonar.token: '%env(SONAR_TOKEN)%'
    sonar.user: '%env(SONAR_USER)%'
    sonar.password: '%env(SONAR_PASSWORD)%'
    sonar.activity.token: '%env(SONAR_ACTIVITY_TOKEN)%'
    sonar.activity.user: '%env(SONAR_ACTIVITY_USER)%'
    sonar.activity.password: '%env(SONAR_ACTIVITY_PASSWORD)%'
    sonar.profiles: '%env(SONAR_PROFILES)%'
    sonar.organization: '%env(SONAR_ORGANIZATION)%'

    # Chiffrement réversible du mot de passe d'accès Actuator (AES-256-GCM)
    # Générer via : openssl rand -base64 32
    actuator.cipher_key: '%env(ACTUATOR_CIPHER_KEY)%'

    # Paramètre HTTP
    ciphers: '%env(CIPHERS)%'
    verify.host: '%env(VERIFY_HOST)%'
    verify.peer: '%env(VERIFY_PEER)%'
    proxy: '%env(PROXY)%'

    # Paramètres MAMOUL_
    # MODIF 2026-06-03 : unification sur MAMOUL_CLI_* (les deux commandes)
    env(MAMOUL_CLI_VERIFY_PEER): '0'
    env(MAMOUL_CLI_VERIFY_HOST): '0'
    env(MAMOUL_CLI_CIPHERS): 'DEFAULT:!DH'
    env(MAMOUL_CLI_USE_PROXY): '0'
    env(MAMOUL_CLI_PROXY_URL): 'https://proxy.example.com:8080'
    env(MAMOUL_CLI_PROXY_USER_PWD): 'utilisateur:motdepasse'
    env(MAMOUL_CLI_NO_PROXY): 'localhost,127.0.0.1'

    # Domaine de repli utilisé pour reconstruire l'adresse à partir d'un identifiant
    # court (« prenom.nom ») lors de l'authentification. Valeur de démonstration :
    # à surcharger via LDAP_UPN_SUFFIX en .env.local sur une instance réelle.
    env(LDAP_UPN_SUFFIX): '@ma-moulinette.fr'

    # Gestion des projets et profils
    maj.projet: '%env(MAJ_PROJET)%'
    maj.profil: '%env(MAJ_PROFIL)%'
    nombre.favori: '%env(NOMBRE_FAVORI)%'
    # Configuration diverse
    track.logger.method: '%env(TRACK_LOGGER_METHOD)%'
    path.audit: '%env(PATH_AUDIT)%'
    environnement: '%env(ENVIRONNEMENT)%'

    # MODIF 2026-05-06
    # Mode du filigrane sur les rapports PDF :
    #   - always       : tous les documents
    #   - confidential : uniquement si document_type contient "confidentiel" (default)
    #   - never        : désactivé
    rapport.pdf.watermark.mode: '%env(RAPPORT_PDF_WATERMARK_MODE)%'

    # Gestion des modules
    module.frontend: '%env(MODULE_FRONTEND)%'
    module.backend: '%env(MODULE_BACKEND)%'
    module.autre: '%env(MODULE_AUTRE)%'

    # Identité et marque
    marque.entreprise.short: '%env(MARQUE_ENTREPRISE_SHORT)%'
    marque.entreprise.long: '%env(MARQUE_ENTREPRISE_LONG)%'
    logo.entreprise: '%env(LOGO_ENTREPRISE)%'

    # RGAA et CGU
    rgaa: '%env(RGAA)%'
    cgu.editeur: '%env(CGU_EDITEUR)%'
    cgu.adresse: '%env(CGU_ADRESSE)%'
    cgu.siret: '%env(CGU_SIRET)%'
    cgu.siren: '%env(CGU_SIREN)%'
    cgu.numero.siret: '%env(CGU_NUMERO_SIRET)%'
    cgu.numero.siren: '%env(CGU_NUMERO_SIREN)%'
    cgu.directeur.publication: '%env(CGU_DIRECTEUR_PUBLICATION)%'
    cgu.url.site: '%env(CGU_URL_SITE)%'
    cgu.source.url: '%env(CGU_SOURCE_URL)%'
    cgu.source.scm: '%env(CGU_SOURCE_SCM)%'
    cgu.hebergement: '%env(CGU_HEBERGEMENT)%'

# ---------------------------------------------------------------------------
# SERVICES
# Configuration des services spécifiques à l'application.
# ---------------------------------------------------------------------------

services:
    # Configuration par défaut des services dans ce fichier
    _defaults:
        autowire: true      # Injection automatique des dépendances.
        autoconfigure: true # Enregistrement automatique des commandes, events, etc.

    # Inclut automatiquement toutes les classes de src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Exception'

    # -----------------------------------------------------------------------
    # Services explicites
    # -----------------------------------------------------------------------
    App\EventSubscriber\ApiClientHeaderSubscriber:
        arguments:
            $appClientToken: '%app.client_token%'
            $allowedOrigins: '%app.allowed_origins%'
            $internalHeaderName: 'X-Internal-Front'
            $internalHeaderValue: 'front-app'

    App\Service\ActuatorCredentialCipher:
        arguments:
            $cipherKey: '%actuator.cipher_key%'

    # Permet d'offusquer les informations sensibles dans les logs.
    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    App\Monolog\Processor\MaskSensitiveEnvVariablesProcessor:
        tags:
            - { name: monolog.processor}

    # On remplace handler par channel
    App\Monolog\Processor\MaskSensitiveDataProcessor:
        tags:
            - { name: monolog.processor, channel: request }

    # MODIF 2026-05-08 : auth token bearer pour les endpoints DC.
    App\EventSubscriber\DependencyCheckTokenSubscriber:
        arguments:
            $expectedToken: '%dc.ingest.token%'
    # Téléchargement des logs
    App\Service\LogArchive\LogArchiveService:
        arguments:
            $logDir: '%kernel.logs_dir%'

    # MODIF 2026-06-09 : sel pour le hash IP (réutilise APP_SECRET)
    App\Service\UserAgent\UserAgentTrackerService:
        arguments:
            $appSalt: '%kernel.secret%'

    # Gestion LDAP
    Symfony\Component\Ldap\Ldap:
        factory: ['Symfony\Component\Ldap\Ldap', 'create']
        arguments:
            - 'ext_ldap'       # adapter PHP natif
            - 
                host: '%env(LDAP_HOST)%'
                port: '%env(LDAP_PORT)%'
                encryption: '%env(LDAP_ENCRYPTION)%'
                options:
                    protocol_version: 3
                    referrals: false
                    network_timeout: 3
                    x_tls_require_cert: '%env(LDAP_X_TLS_REQUIRE_CERT)%'

    # Domaine de repli LDAP injecté explicitement (plus aucune valeur codée en dur
    # dans CustomAuthenticator) — voir env(LDAP_UPN_SUFFIX) ci-dessus.
    App\Security\CustomAuthenticator:
        arguments:
            $ldapUpnSuffix: '%env(LDAP_UPN_SUFFIX)%'

    # MODIF 2026-06-03 : unification MAMOUL_CLI_* + injection RunMoulinetteCollecteCommand.
    App\Command\Prod\UpdateSonarqubeTagsCommand:
        arguments:
            $mamoulCliVerifyPeer: '%env(int:MAMOUL_CLI_VERIFY_PEER)%'
            $mamoulCliVerifyHost: '%env(int:MAMOUL_CLI_VERIFY_HOST)%'
            $mamoulCliCiphers: '%env(MAMOUL_CLI_CIPHERS)%'
            $mamoulCliUseProxy: '%env(int:MAMOUL_CLI_USE_PROXY)%'
            $mamoulCliProxyUrl: '%env(MAMOUL_CLI_PROXY_URL)%'
            $mamoulCliProxyUserPwd: '%env(MAMOUL_CLI_PROXY_USER_PWD)%'
            $mamoulCliNoProxy: '%env(MAMOUL_CLI_NO_PROXY)%'

    App\Command\Prod\RunMoulinetteCollecteCommand:
        arguments:
            $mamoulCliVerifyPeer: '%env(int:MAMOUL_CLI_VERIFY_PEER)%'
            $mamoulCliVerifyHost: '%env(int:MAMOUL_CLI_VERIFY_HOST)%'
            $mamoulCliCiphers: '%env(MAMOUL_CLI_CIPHERS)%'
            $mamoulCliUseProxy: '%env(int:MAMOUL_CLI_USE_PROXY)%'
            $mamoulCliProxyUrl: '%env(MAMOUL_CLI_PROXY_URL)%'
            $mamoulCliProxyUserPwd: '%env(MAMOUL_CLI_PROXY_USER_PWD)%'
            $mamoulCliNoProxy: '%env(MAMOUL_CLI_NO_PROXY)%'
...
