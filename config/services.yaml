---
# services.yaml
# Ce fichier configure les services et dépendances spécifiques à l'application.

imports:
    - { resource: ma-moulinette.yaml }

# ---------------------------------------------------------------------------
# PARAMETERS
# Les paramètres globaux pour l'application sont définis ici.
# Ils sont généralement fournis par des variables d'environnement.
# ---------------------------------------------------------------------------

parameters:
    # API Secure
    app.client_token: '%env(APP_CLIENT_TOKEN)%'
    app.allowed_origins: '%env(csv:APP_ALLOWED_ORIGINS)%'
    api.client_token: '%env(API_CLIENT_TOKEN)%'


    # Configuration SonarQube
    sonar.url: '%env(SONAR_URL)%'
    sonar.version: '%env(SONAR_VERSION)%'
    sonar.token: '%env(SONAR_TOKEN)%'
    sonar.user: '%env(SONAR_USER)%'
    sonar.password: '%env(SONAR_PASSWORD)%'
    sonar.activity.token: '%env(SONAR_ACTIVITY_TOKEN)%'
    sonar.activity.user: '%env(SONAR_ACTIVITY_USER)%'
    sonar.activity.password: '%env(SONAR_ACTIVITY_PASSWORD)%'
    sonar.profiles: '%env(SONAR_PROFILES)%'
    sonar.organization: '%env(SONAR_ORGANIZATION)%'

    # Paramètre HTTP
    ciphers: '%env(CIPHERS)%'
    verify.host: '%env(VERIFY_HOST)%'
    verify.peer: '%env(VERIFY_PEER)%'
    proxy: '%env(PROXY)%'

    # Gestion des projets et profils
    maj.projet: '%env(MAJ_PROJET)%'
    maj.profil: '%env(MAJ_PROFIL)%'
    nombre.favori: '%env(NOMBRE_FAVORI)%'
    # Configuration diverse
    track.logger.method: '%env(TRACK_LOGGER_METHOD)%'
    path.audit: '%env(PATH_AUDIT)%'
    environnement: '%env(ENVIRONNEMENT)%'

    # Gestion des modules
    module.frontend: '%env(MODULE_FRONTEND)%'
    module.backend: '%env(MODULE_BACKEND)%'
    module.autre: '%env(MODULE_AUTRE)%'

    # Identité et marque
    marque.entreprise.short: '%env(MARQUE_ENTREPRISE_SHORT)%'
    marque.entreprise.long: '%env(MARQUE_ENTREPRISE_LONG)%'
    logo.entreprise: '%env(LOGO_ENTREPRISE)%'

    # RGAA et CGU
    rgaa: '%env(RGAA)%'
    cgu.editeur: '%env(CGU_EDITEUR)%'
    cgu.adresse: '%env(CGU_ADRESSE)%'
    cgu.siret: '%env(CGU_SIRET)%'
    cgu.siren: '%env(CGU_SIREN)%'
    cgu.numero.siret: '%env(CGU_NUMERO_SIRET)%'
    cgu.numero.siren: '%env(CGU_NUMERO_SIREN)%'
    cgu.directeur.publication: '%env(CGU_DIRECTEUR_PUBLICATION)%'
    cgu.url.site: '%env(CGU_URL_SITE)%'
    cgu.source.url: '%env(CGU_SOURCE_URL)%'
    cgu.source.scm: '%env(CGU_SOURCE_SCM)%'
    cgu.hebergement: '%env(CGU_HEBERGEMENT)%'

# ---------------------------------------------------------------------------
# SERVICES
# Configuration des services spécifiques à l'application.
# ---------------------------------------------------------------------------

services:
    # Configuration par défaut des services dans ce fichier
    _defaults:
        autowire: true      # Injection automatique des dépendances.
        autoconfigure: true # Enregistrement automatique des commandes, events, etc.

    # Inclut automatiquement toutes les classes de src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Exception'

    # -----------------------------------------------------------------------
    # Services explicites
    # -----------------------------------------------------------------------
    App\EventSubscriber\ApiClientHeaderSubscriber:
        arguments:
            $appClientToken: '%app.client_token%'
            $allowedOrigins: '%app.allowed_origins%'
            $internalHeaderName: 'X-Internal-Front'
            $internalHeaderValue: 'front-app'

    # Permet d'offusquer les informations sensibles dans les logs.
    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

    App\Monolog\Processor\MaskSensitiveEnvVariablesProcessor:
        tags:
            - { name: monolog.processor}

    # On remplace handler par channel
    App\Monolog\Processor\MaskSensitiveDataProcessor:
        tags:
            - { name: monolog.processor, channel: request }

    # Collecte userAgent  définition du salt.
    App\Service\UserAgentTrackerService:
        arguments:
            $appSalt: '%env(APP_USER_AGENT_SALT)%'

    # Téléchargement des logs
    App\Service\LogArchiveService:
        arguments:
            $logDir: '%kernel.logs_dir%'

...
