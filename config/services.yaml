---
# services.yaml
# Ce fichier configure les services et dépendances spécifiques à l'application.

imports:
    - { resource: ma-moulinette.yaml }

# ---------------------------------------------------------------------------
# PARAMETERS
# Les paramètres globaux pour l'application sont définis ici.
# Ils sont généralement fournis par des variables d'environnement.
# ---------------------------------------------------------------------------

parameters:
    # Configuration SonarQube
    sonar.url: '%env(SONAR_URL)%'
    sonar.version: '%env(SONAR_VERSION)%'
    sonar.token: '%env(SONAR_TOKEN)%'
    sonar.user: '%env(SONAR_USER)%'
    sonar.password: '%env(SONAR_PASSWORD)%'
    sonar.activity.token: '%env(SONAR_ACTIVITY_TOKEN)%'
    sonar.activity.user: '%env(SONAR_ACTIVITY_USER)%'
    sonar.activity.password: '%env(SONAR_ACTIVITY_PASSWORD)%'
    sonar.profiles: '%env(SONAR_PROFILES)%'
    sonar.organization: '%env(SONAR_ORGANIZATION)%'

    # HTTP Configuration
    http.ciphers: '%env(CIPHERS)%'
    http.verify.host: '%env(VERIFY_HOST)%'
    http.verify.peer: '%env(VERIFY_PEER)%'
    http.proxy: '%env(PROXY)%'

    # Gestion des projets et profils
    projects.maj_projet: '%env(MAJ_PROJET)%'
    projects.maj_profil: '%env(MAJ_PROFIL)%'

    # Configuration diverse
    track_logger_method: '%env(TRACK_LOGGER_METHOD)%'
    csrf_salt: '%env(CSRF_SALT)%'
    path_audit: '%env(PATH_AUDIT)%'
    environnement: '%env(ENVIRONNEMENT)%'

    # Identité et marque
    entreprise.marque.short: '%env(MARQUE_ENTREPRISE_SHORT)%'
    entreprise.marque.long: '%env(MARQUE_ENTREPRISE_LONG)%'
    entreprise.logo: '%env(LOGO_ENTREPRISE)%'

    # RGAA et CGU
    rgaa: '%env(RGAA)%'
    cgu.editeur: '%env(CGU_EDITEUR)%'
    cgu.adresse: '%env(CGU_ADRESSE)%'
    cgu.siret: '%env(CGU_SIRET)%'
    cgu.siren: '%env(CGU_SIREN)%'
    cgu.numero.siret: '%env(CGU_NUMERO_SIRET)%'
    cgu.numero.siren: '%env(CGU_NUMERO_SIREN)%'
    cgu.directeur_publication: '%env(CGU_DIRECTEUR_PUBLICATION)%'
    cgu.url.site: '%env(CGU_URL_SITE)%'
    cgu.source.url: '%env(CGU_SOURCE_URL)%'
    cgu.source.scm: '%env(CGU_SOURCE_SCM)%'
    cgu.hebergement: '%env(CGU_HEBERGEMENT)%'

# ---------------------------------------------------------------------------
# SERVICES
# Configuration des services spécifiques à l'application.
# ---------------------------------------------------------------------------

services:
    # Configuration par défaut des services dans ce fichier
    _defaults:
        autowire: true      # Injection automatique des dépendances.
        autoconfigure: true # Enregistrement automatique des commandes, events, etc.

    # Inclut automatiquement toutes les classes de src/
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # -----------------------------------------------------------------------
    # Services explicites
    # -----------------------------------------------------------------------

    # RabbitMQ Service
    App\Service\RabbitMQService:
        arguments:
            $host: '%env(RABBITMQ_HOST)%'
            $port: '%env(int:RABBITMQ_PORT)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_PASSWORD)%'
            $vhost: '%env(RABBITMQ_VHOST)%'

    # Serializer pour Messenger
    messenger.transport.serializer:
        alias: 'Symfony\Component\Messenger\Transport\Serialization\SerializerInterface'

    # Transport Factory pour RabbitMQ
    App\Transport\RabbitMqTransportFactory:
        arguments:
            $rabbitMqService: '@App\Service\RabbitMQService'
        tags: ['messenger.transport_factory']

    # Transport RabbitMQ
    App\Transport\RabbitMqTransport:
        factory: ['@App\Transport\RabbitMqTransportFactory', 'createTransport']
        arguments:
            $dsn: '%env(MESSENGER_TRANSPORT_RABBITMQ_DSN)%'
            $options: []
            $serializer: '@messenger.transport.serializer'

    # Exemple pour les tests unitaires
    App\Controller\Batch\BatchCollecteTodoController:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $client: '@App\Service\Client'
        tags: ['controller.service_arguments']
...
